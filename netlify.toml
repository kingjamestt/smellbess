# Netlify builds the site in web/ (Next.js, Node 24 from web/.nvmrc).
# Environment variables are set in the Netlify UI, never here: see web/.env.example.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime: turns the build into server functions. Without it
# the deploy uploads 0 functions and every page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
